job:
  group: tokenizer
  name: multi_backbone_finetune
  project: chp_vtok
model:
  _target_: <class 'cosmos_predict1.tokenizer.training.chp_model.CHPTrainingModel'>
  config:
    disc: null
    disc_optimizer: null
    disc_scheduler: null
    ema:
      beta: 0.9999
      enabled: false
      torch_compile_buffer_renaming: false
    latent_weight: 1.0
    loss:
      _target_: <class 'cosmos_predict1.tokenizer.training.losses.continuous.TokenizerLoss'>
      config:
        color:
          _target_: <class 'cosmos_predict1.tokenizer.training.losses.continuous.ColorLoss'>
          config:
            boundaries:
            - 0
            norm: L1
            values:
            - 1.0
        perceptual:
          _target_: <class 'cosmos_predict1.tokenizer.training.chp_losses.NativeCropPerceptualLoss'>
          config:
            checkpoint_activations: true
            corr_boundaries:
            - 0
            corr_enabled: false
            corr_values:
            - 0.0
            gram_boundaries:
            - 500000
            gram_enabled: false
            gram_values:
            - 0.0
            - 0.062
            layer_weights:
            - 0.3846153846153846
            - 0.20833333333333334
            - 0.27027027027027023
            - 0.17857142857142858
            - 6.666666666666667
            lpips_boundaries:
            - 0
            lpips_values:
            - 0.1
          crop_size: '256'
        reduce: MEAN
    metric:
      _target_: <class 'cosmos_predict1.tokenizer.training.metrics.TokenizerMetric'>
      config: {}
    network:
      _target_: <class 'cosmos_predict1.tokenizer.progressive.model.CHPVTokenizer'>
      config:
        anchor_order: halton
        backbone_checkpoint: checkpoints/infotok-flex/infotok_mse.pt
        base_tokens: '256'
        budgets:
        - '256'
        - '512'
        - '1024'
        - '2048'
        checkpoint_decoder: 'True'
        debug_backbone: 'False'
        decoder_neighbors: '8'
        freeze_backbone: 'False'
        heads: '4'
        hidden_dim: '128'
        kmax: '2048'
        local_radius: '2'
        multiscale: 'True'
        spatial_window: '16'
        structure_tokens: '768'
    precision: bfloat16
    temporal_weight: 0.1
    torch_compile: false
